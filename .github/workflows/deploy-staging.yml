name: Staging Deployment

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub.
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/ec2-api:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Staging via SSH over Tailscale.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker network create aws-staging-network || true
            docker pull qarani/ec2-api:staging
            docker stop ec2-service-staging || true
            docker rm ec2-service-staging || true
            docker run -d --name ec2-service-staging \
              --network aws-staging-network \
              -p 8088:8088 \
              -e APP_PROFILE=staging \
              -e SERVICE_NAME=ec2-service \
              -e DB_HOST=postgres-staging \
              -e DB_PORT=5432 \
              -e DB_USER=root \
              -e DB_PASSWORD=root \
              -e DB_NAME=ec2_db \
              -e DB_SSLMODE=disable \
              -e NATS_URL=nats://nats-staging:4222 \
              -e NATS_USER=auth-server \
              -e NATS_PASSWORD=auth-secret \
              -e LIBVIRT_URI=qemu:///system \
              -e IMAGES_DIR=/var/lib/libvirt/images \
              -e MINIO_ENDPOINT=minio-staging:9000 \
              -e MINIO_ACCESS_KEY=minioadmin \
              -e MINIO_SECRET_KEY=minioadmin123 \
              -e MINIO_USE_SSL=false \
              qarani/ec2-api:staging