name: Staging Deployment Pipeline

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]

jobs:
  staging-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install libvirt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            libvirt-daemon \
            pkg-config
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test ./... -v

  staging-build-image:
      runs-on: ubuntu-latest
      if: github.event_name == 'push'
      needs: staging-test
      steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            qarani/ec2-api:staging
            qarani/ec2-api:staging-${{ github.sha }}

  staging-deploy:
    needs: staging-build-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Staging via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker network create aws-staging-network || true
            docker pull qarani/ec2-api:staging-${{ github.sha }}
            docker stop ec2-service-staging || true
            docker rm ec2-service-staging || true
            docker service update \
              --image qarani/ec2-api:prod-${{ github.sha }} \
              --cap-add SYS_ADMIN \
              --cap-add NET_ADMIN \
              --cap-add SYS_PTRACE \
              --device-add /dev/kvm \
              --mount-add type=bind,source=/var/lib/libvirt/game-files,target=/var/lib/libvirt/game-files \
              --mount-add type=bind,source=/boot,target=/boot,readonly \
              --mount-add type=bind,source=/lib/modules,target=/lib/modules,readonly \
              ec2-service-prod 2>/dev/null || \
            docker service create \
              --name ec2-service-prod \
              --network aws-prod-network \
              --publish published=8088,target=8088 \
              --cap-add SYS_ADMIN \
              --cap-add NET_ADMIN \
              --cap-add SYS_PTRACE \
              --security-opt apparmor=unconfined \
              --mount type=bind,source=/var/lib/libvirt/images,target=/var/lib/libvirt/images \
              --mount type=bind,source=/var/lib/libvirt/game-files,target=/var/lib/libvirt/game-files \
              --mount type=bind,source=/var/run/libvirt/libvirt-sock,target=/var/run/libvirt/libvirt-sock \
              --mount type=bind,source=/boot,target=/boot,readonly \
              --mount type=bind,source=/lib/modules,target=/lib/modules,readonly \
              --host host.docker.internal:host-gateway \
              --env APP_PROFILE=prod \
              --env SERVICE_NAME=ec2-service \
              --env DB_HOST=postgres-prod \
              --env DB_PORT=5432 \
              --env DB_USER=postgres-prod-user \
              --env DB_PASSWORD=postgres-prod-password \
              --env DB_NAME=ec2_db \
              --env DB_SSLMODE=disable \
              --env NATS_URL=nats://nats-prod:4222 \
              --env NATS_USER=nats-prod-user \
              --env NATS_PASSWORD=nats-prod-password \
              --env NATS_PREFIX=prod.v1 \
              --env API_GATEWAY=http://${{secrets.PROD_HOST}}:8080 \
              --env EUREKA_SERVER_URL=http://discovery-server-prod:8761/eureka \
              --env EUREKA_APP_NAME=EC2-SERVICE \
              --env EUREKA_HOSTNAME=ec2-service-prod \
              --env EUREKA_IP_ADDR=127.0.0.1 \
              --env EUREKA_VIP_ADDRESS=ec2-service \
              --env EUREKA_INSTANCE_ID=ec2-service:8088 \
              --env MINIO_ENDPOINT=minio-prod:9000 \
              --env MINIO_ACCESS_KEY=minio-prod-user \
              --env MINIO_SECRET_KEY=minio-prod-password \
              --env MINIO_USE_SSL=false \
              --env MIGRATIONS_PATH=/app/migrations \
              --env IMAGES_DIR=/var/lib/libvirt/images \
              --env AGENT_URL=ws://host.docker.internal:9030/terminal \
              --env LIBVIRT_URI=qemu+unix:///system?socket=/var/run/libvirt/libvirt-sock \
              qarani/ec2-api:prod-${{ github.sha }}



  open-pr-to-main:
    needs: staging-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR staging → main
        run: |
          if gh pr list --base main --head staging --state open --json number | jq -e 'length > 0' > /dev/null; then
            echo "PR already exists. Skipping..."
          else
            gh pr create \
              --base main \
              --head staging \
              --title "chore: promote staging → main" \
              --body "✅ Staging deployment succeeded. Auto-generated PR for production release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}



