name: Staging Deployment

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub.
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push.
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/ec2-api:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Staging via SSH over Tailscale.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker network create aws-staging-network || true
            docker pull qarani/ec2-api:staging
            docker stop ec2-service-staging || true
            docker rm ec2-service-staging || true
            docker run -d --name ec2-service-staging \
              --network aws-staging-network \
              -p 8088:8088 \
              -v /var/lib/libvirt/images:/var/lib/libvirt/images \
              -v /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock \
              --group-add 120 \
              -e APP_PROFILE=staging \
              -e SERVICE_NAME=ec2-service \
              -e DB_HOST=postgres-staging \
              -e EUREKA_HOSTNAME=ec2-service-staging \
              -e EUREKA_IP_ADDR=127.0.0.1 \
              -e DB_PORT=5432 \
              -e DB_USER=postgres-staging-user \
              -e DB_PASSWORD=postgres-staging-password \
              -e DB_NAME=ec2_db \
              -e EUREKA_SERVER_URL=http://discovery-server-staging:8761/eureka \
              -e DB_SSLMODE=disable \
              -e NATS_URL=nats://nats-staging:4222 \
              -e NATS_USER=nats-staging-user \
              -e NATS_PASSWORD=nats-staging-password \
              -e IMAGES_DIR=/var/lib/libvirt/images \
              -e MINIO_ENDPOINT=minio-staging:9000 \
              -e MINIO_ACCESS_KEY=minio-staging-user \
              -e MINIO_SECRET_KEY=minio-staging-password \
              -e MINIO_USE_SSL=false \
              -e NATS_PREFIX=staging.v1 \
              -e "LIBVIRT_URI=qemu+unix:///system?socket=/var/run/libvirt/libvirt-sock" \
              qarani/ec2-api:staging



  open-pr-to-main:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR staging → main
        run: |
          if gh pr list --base main --head staging --state open --json number | jq -e 'length > 0' > /dev/null; then
            echo "PR already exists. Skipping..."
          else
            gh pr create \
              --base main \
              --head staging \
              --title "chore: promote staging → main" \
              --body "✅ Staging deployment succeeded. Auto-generated PR for production release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}