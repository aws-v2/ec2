name: Prod Deployment

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: qarani/ec2-api:prod

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Prod via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker network create aws-prod-network || true
            docker pull qarani/ec2-api:prod
            docker stop ec2-service-prod || true
            docker rm ec2-service-prod || true
            docker run -d \
              --name ec2-service-prod \
              --network aws-prod-network \
              -p 8088:8088 \
              -v /var/lib/libvirt/images:/var/lib/libvirt/images \
              -v /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock \
              --group-add 120 \
              -e APP_PROFILE=prod \
              -e SERVICE_NAME=ec2-service \
              -e DB_HOST=postgres-prod \
              -e DB_PORT=5432 \
              -e DB_USER=postgres-prod-user \
              -e DB_PASSWORD=postgres-prod-password \
              -e DB_NAME=ec2_db \
              -e DB_SSLMODE=disable \
              -e NATS_URL=nats://nats-prod:4222 \
              -e NATS_USER=nats-prod-user \
              -e NATS_PASSWORD=nats-prod-password \
              -e NATS_SUBJECT_PREFIX=prod.v1 \
              -e EUREKA_SERVER_URL=http://discovery-server-prod:8761/eureka \
              -e EUREKA_APP_NAME=EC2-SERVICE \
              -e EUREKA_HOSTNAME=ec2-service-prod \
              -e EUREKA_IP_ADDR=127.0.0.1 \
              -e EUREKA_VIP_ADDRESS=ec2-service \
              -e EUREKA_INSTANCE_ID=ec2-service:8088 \
              -e MINIO_ENDPOINT=minio-prod:9000 \
              -e MINIO_ACCESS_KEY=minio-prod-user \
              -e MINIO_SECRET_KEY=minio-prod-password \
              -e MINIO_USE_SSL=false \
              -e LIBVIRT_URI=qemu+unix:///system?socket=/var/run/libvirt/libvirt-sock \
              -e IMAGES_DIR=/var/lib/libvirt/images \
              qarani/ec2-api:prod




